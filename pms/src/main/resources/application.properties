spring.application.name=Project and Employee Performance Management System
server.port=8080

# ---- MySQL ----
# Create the schema once:  CREATE DATABASE pms_db;
spring.datasource.url=jdbc:mysql://localhost:3306/pms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=@Vedu#007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- File uploads ----
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ---- Claude API ----
# Leave the key blank and the AI features fall back to local heuristics.
# Set it with an environment variable:  CLAUDE_API_KEY=sk-ant-...
claude.api-key=${CLAUDE_API_KEY:}
claude.model=claude-sonnet-4-6
claude.max-tokens=1200
claude.enabled=true

logging.level.com.pms=INFO
