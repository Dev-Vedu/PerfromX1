<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Assign a task', ~{::main})}">
<body>
<main>
    <div class="page-head">
        <div>
            <h1>Assign a task</h1>
            <p class="sub">The owner is notified straight away and sees it on their dashboard.</p>
        </div>
    </div>

    <form th:action="@{/tasks}" th:object="${form}" method="post" class="card" style="max-width:720px">
        <input type="hidden" th:field="*{id}">

        <div class="field">
            <label for="title">Task title</label>
            <input type="text" id="title" th:field="*{title}">
            <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
        </div>

        <div class="field">
            <label for="description">What done looks like</label>
            <textarea id="description" th:field="*{description}"
                      placeholder="Scope, acceptance criteria, links to anything the owner needs."></textarea>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="projectId">Project</label>
                <select id="projectId" th:field="*{projectId}">
                    <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}">Project</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('projectId')}" th:errors="*{projectId}"></p>
            </div>
            <div class="field">
                <label for="assigneeId">Owner</label>
                <select id="assigneeId" th:field="*{assigneeId}">
                    <option value="">Leave unassigned</option>
                    <option th:each="p : ${people}" th:value="${p.id}" th:text="${p.fullName}">Person</option>
                </select>
            </div>
            <div class="field">
                <label for="priority">Priority</label>
                <select id="priority" th:field="*{priority}">
                    <option th:each="p : ${T(com.pms.entity.Priority).values()}"
                            th:value="${p}" th:text="${p.label}">Medium</option>
                </select>
            </div>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="startDate">Start date</label>
                <input type="date" id="startDate" th:field="*{startDate}">
            </div>
            <div class="field">
                <label for="deadline">Deadline</label>
                <input type="date" id="deadline" th:field="*{deadline}">
                <p class="error" th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}"></p>
            </div>
        </div>

        <div class="actions">
            <button class="btn" type="submit">Assign task</button>
            <a class="btn btn-quiet" th:href="@{/projects}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
